<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" 
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" 
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

     <main class="profile-container">

        <!-- Form -->
        <section class="profile-form">

            <form>

                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="What should we call you?"
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="john@doe.com"
                    aria-invalid="true"
                >

                <p class="error-message">Email is already taken</p>

                <label for="password">Enter Password</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="xxxxxxxx"
                    >
                    <i class="fa-solid fa-eye"></i>
                </div>

                <label for="confirm-password">Confirm Password</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="xxxxxxxx"
                    >
                    <i class="fa-solid fa-eye"></i>
                </div>

                <button type="submit">Update Profile</button>

            </form>

        </section>


        <!-- Profile completeness -->
        <section class="profile-progress">

            <div class="progress-circle">
                <span>65%</span>
            </div>

            <h2>Profile Completeness</h2>

            <div class="checklist">
                <p class="completed">Create Account</p>
                <p class="completed">Update Roadmap Progress</p>
                <p class="completed">Setup Public Profile</p>
                <p>Complete your first project</p>
                <p>Invite your Friends</p>
            </div>

        </section>

    </main>



</body>
</html>
